<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ro'yxatdan o'tish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css?v=7" />
</head>
<body>
  <div id="app">
    <main id="question-area" class="reg-main">
      <div class="hero">
        <div class="monogram">N<span>O</span></div>
        <h1>Nargiza Olimovna</h1>
        <p>akademiyasi · Onlayn test platformasi</p>
      </div>

      <div id="reg-form" class="card">
        <div class="mode-switch hidden" id="mode-switch">
          <button type="button" id="mode-new" class="mode-btn active">✅ Yangi test</button>
          <button type="button" id="mode-resume" class="mode-btn">🔄 Davom ettirish</button>
        </div>

        <div id="name-block">
          <label class="field-label">Ism va familiyangiz</label>
          <input id="full-name" class="short-answer-input" placeholder="Ism Familiya" autocapitalize="words" />
        </div>

        <label class="field-label">Test kodi</label>
        <input id="test-code" class="short-answer-input" placeholder="Masalan: AB12CD" autocapitalize="characters" />

        <div id="category-block">
          <label class="field-label">Toifangizni belgilang</label>
          <div class="options" id="category-options">
            <button type="button" class="option-btn" data-category="filolog">Filolog o'qituvchisi</button>
            <button type="button" class="option-btn" data-category="boshlangich">Boshlang'ich o'qituvchisi</button>
            <button type="button" class="option-btn" data-category="abituriyent_asosiy">Abituriyent (asosiy blok)</button>
            <button type="button" class="option-btn" data-category="abituriyent_majburiy">Abituriyent (majburiy blok)</button>
          </div>
        </div>

        <p id="resume-hint" class="hint hidden">Test uzilib qolgan bo'lsa, o'sha test kodini kiriting — o'zingiz qolgan savoldan davom etasiz. Vaqt ham uzilgan joyidan hisoblanadi.</p>

        <div id="reg-error" class="reg-error"></div>
        <button id="reg-submit" class="gold-btn">Davom etish</button>
      </div>

      <div id="reg-confirm" class="card hidden">
        <div id="confirm-warning" class="confirm-text"></div>
        <button id="reg-start-btn" class="gold-btn">🚀 Testni boshlash</button>
      </div>
    </main>
  </div>

  <script src="/static/register.js?v=5"></script>
</body>
</html>
